server:
  host: "0.0.0.0"
  port: 8000
  reload: true

whisper:
  model_size: "qbsmlabs/PhoWhisper-small" # Model VinAI nhưng được port sang dạng CTranslate2 cho Faster-Whisper
  language: "vi"               # tiếng Việt
  device: "cpu"                # cpu | cuda
  compute_type: "int8"         # int8 (CPU) | float16 (GPU)
  beam_size: 5
  vad_filter: false            # lọc khoảng lặng tự động (đã dùng Silero VAD ngoài nên để false)

audio:
  sample_rate: 16000
  channels: 1
  chunk_duration_sec: 30       # max duration mỗi chunk (giây)
  device_index: 2              # ID của mic. Thường 2 hoặc 8 là Realtek Mic. -1 là mặc định.

logging:
  level: "INFO"

assistant:
  llm_base_url: "http://localhost:6011"
  model_size: "deepseek-v4-flash-nothinking"
  llm_api_key: "thanh2004"
  wake_words:                  # Từ khoá kích hoạt phiên làm việc
    - "quản gia"
  end_words:                   # Từ khoá kết thúc phiên
    - "tạm biệt"
    - "xong rồi"
    - "thôi nhé"
    - "cảm ơn thôi"
    - "hết rồi"
    - "goodbye"
  system_prompt: |
    Bạn là Quản gia Thành, trợ lý AI thông minh cho nhà thông minh.

    NHIỆM VỤ: Phân tích yêu cầu người dùng và TRẢ VỀ ĐÚNG DẠNG JSON, không thêm bất kỳ nội dung nào khác ngoài JSON.

    ĐỊNH DẠNG BẮT BUỘC:
    {"message": "câu trả lời ngắn gọn tiếng Việt", "command": "MÃ_LỆNH hoặc NONE"}

    QUY TẮC PHÂN LOẠI:
    1. Điều khiển thiết bị IoT (đèn, quạt, điều hòa, cửa...) → command: "IOT:TÊN_THIẾT_BỊ:HÀNH_ĐỘNG"
       Ví dụ: "IOT:LIGHT_LIVING:ON", "IOT:FAN:OFF", "IOT:AC:SET_TEMP_25", "IOT:DOOR:LOCK"
    2. Điều khiển phần mềm (mở app, trình duyệt, file...) → command: "SW:TÊN_APP:HÀNH_ĐỘNG"
       Ví dụ: "SW:CHROME:OPEN", "SW:SPOTIFY:PLAY", "SW:SHUTDOWN:NOW"
    3. Người dùng muốn kết thúc (tạm biệt, xong rồi, thôi nhé...) → command: "SESSION:END"
       Ví dụ: {"message": "Tạm biệt bạn, hẹn gặp lại.", "command": "SESSION:END"}
    4. Giao tiếp thông thường (hỏi đáp, trò chuyện) → command: "NONE"

    QUY TẮc KHÁC:
    - TUYỆT ĐỐI KHÔNG dùng emoji hoặc icon.
    - message phải ngắn gọn, dưới 20 từ, bằng tiếng Việt.
    - Chỉ trả về JSON, không giải thích thêm.

    Ví dụ:
    User: "Bật đèn phòng khách" → {"message": "Đã bật đèn phòng khách.", "command": "IOT:LIGHT_LIVING:ON"}
    User: "Mở Chrome" → {"message": "Đang mở trình duyệt Chrome.", "command": "SW:CHROME:OPEN"}
    User: "Hôm nay thứ mấy?" → {"message": "Hôm nay là thứ Hai.", "command": "NONE"}
    User: "Nóng quá" → {"message": "Đã giảm nhiệt độ điều hòa xuống 24 độ.", "command": "IOT:AC:SET_TEMP_24"}
    User: "Xong rồi, cảm ơn" → {"message": "Tạm biệt bạn, hẹn gặp lại.", "command": "SESSION:END"}

tts:
  model_path: "models/tts/vi_VN-vais1000-medium.onnx"
  config_path: "models/tts/vi_VN-vais1000-medium.onnx.json"

supertonic:
  enabled: true
  voice_style: "M2"
  speed: 1.05
  total_steps: 8

vision:
  enabled: true
  camera_id: 0             # ID camera (0, 1...) hoặc URL định dạng "http://192.168.1.100:4747/video" cho DroidCam
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.5
  show_window: true         # Hiện cửa sổ camera để debug (có thể tắt khi chạy thực tế)
  face_model: "ArcFace"
  face_detector: "opencv"
  face_threshold: 0.35
  anti_spoofing: true

mqtt:
  enabled: true
  broker: "localhost"
  port: 1883
  user: ""
  password: ""
  client_id: "ai_assistant"
  topics:
    command: "home/assistant/command"
    status: "home/assistant/status"
    event: "home/assistant/event"
    iot: "home/assistant/control"

